          -DCMAKE_BUILD_TYPE=Release
          -DRX14_PRO_BUILD=OFF
          -DBUILD_TESTING=ON
          -DRX14_KTM_XC2=OFF
      - name: Prove KTM targets and optional Qt modules are absent
        shell: bash
        run: |
