          if grep -q '^Qt6Test_DIR:' build/CMakeCache.txt; then
            echo 'Qt Test was discovered with KTM disabled' >&2
            exit 1
          fi
          if grep -q '^Qt6WebSockets_DIR:' build/CMakeCache.txt; then
            echo 'Qt WebSockets was discovered with KTM disabled' >&2
            exit 1
          fi
          python3 - <<'PY'
          import json
          from pathlib import Path
          import re

          reply = Path('build/.cmake/api/v1/reply')
          indexes = sorted(reply.glob('index-*.json'))
          if not indexes:
              raise SystemExit('missing CMake file API reply index')
          index = json.loads(indexes[-1].read_text(encoding='utf-8'))
          codemodels = [
              item for item in index.get('objects', [])
              if item.get('kind') == 'codemodel'
              and item.get('version', {}).get('major') == 2
          ]
          if len(codemodels) != 1:
              raise SystemExit(
                  f'expected one codemodel-v2 reply, got {len(codemodels)}')
          codemodel = json.loads(
              (reply / codemodels[0]['jsonFile']).read_text(encoding='utf-8'))
          targets = [
              target.get('name', '')
              for config in codemodel.get('configurations', [])
              for target in config.get('targets', [])
          ]
          forbidden = sorted(
              name for name in targets if re.search(r'(ktm|xc2)', name, re.I))
          if forbidden:
              raise SystemExit(f'forbidden option-off targets: {forbidden}')
          print(f'PASS: {len(targets)} codemodel targets contain no ktm/xc2 name')
          PY
      - name: Build romHEX14 and base tests
        run: cmake --build build --parallel
      - name: Run all registered base tests
        run: ctest --test-dir build --output-on-failure
